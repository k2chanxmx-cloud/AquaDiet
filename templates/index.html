    @media(max-width:480px){

  </style>

  <style id="coach-mobile-ultratight-v21">

  <style id="meal-add-button-v1">

  <style id="ai-comment-autogrow-final">
    .ai-comment-text{
      height:auto !important;

  <style id="tweet-ui-v4">
    .bottom-nav{grid-template-columns:repeat(4,minmax(0,1fr)) !important;}
    .tweet-count{font-size:12px;font-weight:900;color:#3d8b57;background:#e5f6ea;padding:7px 10px;border-radius:999px;}
    .tweet-textarea{min-height:180px;resize:vertical;font-size:15px;line-height:1.75;margin-top:10px;}

    .tweet-history-row strong{display:block;color:#2d8a4c;margin-bottom:6px;}
    .tweet-history-row span{display:block;font-size:13px;line-height:1.6;}

  <style id="exercise-row-ui-v5">
    .exercise-item{
      background:#f8fcf9;

    .exercise-top{

    .exercise-add-button{

</head>
<body>
  <main class="app-shell">
    <span id="buildMarker" style="display:none">AquaDiet-index-v2.5</span>
    <header class="topbar">
      <div>
        <div class="eyebrow">AQUADIET</div>
        <h1>今日の記録</h1>
      </div>
      <input id="datePicker" type="date" value="{{ selected_date }}">
    </header>

    <section id="todayTab" class="tab-panel active">
      <section class="card weight-card">
        <div class="section-head">
          <h2>⚖️ 体重</h2>
          <span id="weightDiff" class="subtle">前回比 —</span>
        </div>
        <div class="weight-input-wrap">
          <input id="weight" type="number" step="0.1" min="20" max="300" placeholder="00.0">
          <span>kg</span>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>🍽️ 食事</h2>
        </div>
        <div id="mealList"></div>
        <button class="meal-add-button" type="button" onclick="addMeal()">＋ 食事を追加</button>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>🏃 トレーニング</h2>
        </div>

        <div id="exerciseList"></div>

        <button class="exercise-add-button" type="button" onclick="addExercise()">＋ トレーニングを追加</button>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>💪 筋肉痛</h2>
        </div>
        <div class="inline-add">
          <input id="sorenessInput" type="text" placeholder="筋肉名（例：腹直筋）">
          <button type="button" onclick="addSoreness()">追加</button>
        </div>
        <div id="sorenessTags" class="tags"></div>
      </section>

      <button id="saveButton" class="primary-button" onclick="saveDayAndComment()">記録を保存</button>

      <section class="coach-card">
        <div class="coach-visual">
          <h2 class="coach-title">🌟あきおちゃんからのコメント🌟</h2>
          <div class="character-wrap">
            <img src="/static/character.webp" alt="あきおちゃん" class="character-silhouette">
          </div>
        </div>

        <div id="aiComment" class="ai-comment-text">記録したら、今日の様子を見てコメントする。</div>
      </section>
    </section>

    <section id="historyTab" class="tab-panel">
      <section class="card">
        <h2>📖 履歴</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </section>

    <section id="graphTab" class="tab-panel">
      <section class="card">
        <h2>📈 体重グラフ</h2>
        <canvas id="weightChart"></canvas>
      </section>
    </section>
  
    <section id="tweetTab" class="tab-panel">
      <section class="card tweet-card">
        <div class="section-head">
          <h2>🐦 ツイート</h2>
          <span id="tweetCount" class="tweet-count">0 / 140</span>
        </div>
        <p class="subtle">今日の記録から140字以内の投稿文を作って、日付ごとに保存します。</p>
        <textarea id="tweetText" class="tweet-textarea" maxlength="140" rows="8" placeholder="ツイート用テキスト"></textarea>
        <div class="tweet-actions">
          <button type="button" class="tweet-secondary" onclick="generateTweet()">再生成</button>
          <button type="button" class="tweet-secondary" onclick="saveTweet()">保存</button>
          <button type="button" class="tweet-primary" onclick="copyTweet()">コピー</button>
        </div>
      </section>

      <section class="card">
        <h2>🗓 過去のツイート</h2>
        <div id="tweetHistory" class="tweet-history"></div>
      </section>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="todayTab"><span>☀️</span>今日</button>
    <button class="nav-btn" data-tab="historyTab"><span>📖</span>履歴</button>
    <button class="nav-btn" data-tab="graphTab"><span>📈</span>グラフ</button>
      <button class="nav-btn" data-tab="tweetTab"><span>🐦</span>ツイート</button>
  </nav>

<script>
const mealTypes = ["朝食","昼食","夕飯","夜食","間食"];
let soreness = [];
let weightChart = null;

function mealCard(data={}) {
  const options = mealTypes.map(x => `<option ${x === (data.meal_type || "朝食") ? "selected" : ""}>${x}</option>`).join("");
  const div = document.createElement("div");
  div.className = "meal-item";
  div.innerHTML = `
    <div class="meal-top">
      <select class="meal-type">${options}</select>
      <button type="button" class="delete-button" onclick="this.closest('.meal-item').remove()">削除</button>
    </div>
    <textarea class="meal-text" rows="2" placeholder="食べたものを入力">${data.meal_text || ""}</textarea>
    <label class="vomit-check">
      <input type="checkbox" class="meal-vomited" ${data.vomited ? "checked" : ""}>
      <span>この食事のあと嘔吐した</span>
    </label>`;
  return div;
}

function addMeal(data={}) {
  document.getElementById("mealList").appendChild(mealCard(data));
}

function addSoreness(name=null) {
  const input = document.getElementById("sorenessInput");
  const value = (name || input.value).trim();
  if (!value || soreness.includes(value)) return;
  soreness.push(value);
  input.value = "";
  renderSoreness();
}

function renderSoreness() {
  document.getElementById("sorenessTags").innerHTML = soreness.map((x,i) =>
    `<button type="button" class="tag" onclick="removeSoreness(${i})">${x} ×</button>`
  ).join("");
}

function removeSoreness(i) {
  soreness.splice(i,1);
  renderSoreness();
}

async function loadDay() {
  const d = document.getElementById("datePicker").value;
  const res = await fetch(`/api/day/${d}`);
  if (!res.ok) {
    console.warn("load failed");
    document.getElementById("mealList").innerHTML = "";
    addMeal();
    return;
  }
  const data = await res.json();
  document.getElementById("weight").value = data.daily?.weight ?? "";
  document.getElementById("aiComment").textContent = data.daily?.ai_comment || "記録したら、今日の様子を見てコメントする。";

  document.getElementById("mealList").innerHTML = "";
  (data.meals?.length ? data.meals : [{}]).forEach(addMeal);

  document.getElementById("exerciseList").innerHTML = "";
  (data.exercises?.length ? data.exercises : [{}]).forEach(addExercise);

  soreness = (data.soreness || []).map(x => x.muscle_name);
  renderSoreness();

  await updateWeightDiff(d, data.daily?.weight);
}

async function updateWeightDiff(d, currentWeight) {
  const res = await fetch("/api/weights");
  if (!res.ok) return;
  const rows = await res.json();
  const previous = rows.filter(x => x.log_date < d && x.weight != null).slice(-1)[0];
  const el = document.getElementById("weightDiff");
  if (currentWeight != null && previous?.weight != null) {
    const diff = Number(currentWeight) - Number(previous.weight);
    el.textContent = `前回比 ${diff >= 0 ? "+" : ""}${diff.toFixed(1)}kg`;
  } else {
    el.textContent = "前回比 —";
  }
}

function collectMeals() {
  return [...document.querySelectorAll(".meal-item")].map(row => ({
    meal_type: row.querySelector(".meal-type").value,
    meal_text: row.querySelector(".meal-text").value.trim(),
    vomited: row.querySelector(".meal-vomited").checked
  }));
}


const exerciseTypes = ["腹筋","腹斜筋","スクワット","ランニング","ジム","パーソナル"];

function exerciseCard(data={}) {
  const selectedType = data.exercise_type || "腹筋";
  const options = exerciseTypes.map(x =>
    `<option ${x === selectedType ? "selected" : ""}>${x}</option>`
  ).join("");

  const div = document.createElement("div");
  div.className = "exercise-item";

  div.innerHTML = `
    <div class="exercise-top">
      <select class="exercise-type" onchange="updateExerciseUnit(this)">
        ${options}
      </select>
      <button type="button" class="delete-button" onclick="this.closest('.exercise-item').remove()">削除</button>
    </div>

    <div class="exercise-amount-row">
      <input
        class="exercise-amount"
        type="number"
        min="0"
        inputmode="numeric"
        placeholder="${selectedType === "ランニング" ? "時間" : "回数"}"
        value="${data.amount ?? ""}"
      >
      <span class="exercise-unit">${data.unit || (selectedType === "ランニング" ? "分" : "回")}</span>
    </div>

    <input
      class="exercise-memo"
      type="text"
      placeholder="メモ（任意）"
      value="${escapeHtml(data.memo || "")}"
    >
  `;

  return div;
}

function addExercise(data={}) {
  document.getElementById("exerciseList").appendChild(exerciseCard(data));
}

function updateExerciseUnit(select) {
  const row = select.closest(".exercise-item");
  const unit = row.querySelector(".exercise-unit");
  const amount = row.querySelector(".exercise-amount");

  if (select.value === "ランニング") {
    unit.textContent = "分";
    amount.placeholder = "時間";
  } else {
    unit.textContent = "回";
    amount.placeholder = "回数";
  }
}

function collectExercises() {
  return [...document.querySelectorAll(".exercise-item")].map(row => ({
    exercise_type: row.querySelector(".exercise-type").value,
    amount: row.querySelector(".exercise-amount").value,
    unit: row.querySelector(".exercise-unit").textContent.trim(),
    memo: row.querySelector(".exercise-memo").value.trim()
  })).filter(x => x.exercise_type);
}

async function saveDay(showAlert=true) {
  const body = {
    date: document.getElementById("datePicker").value,
    weight: document.getElementById("weight").value,
    meals: collectMeals(),
    exercises: collectExercises(),
    soreness
  };

  const res = await fetch("/api/day", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });

  if (!res.ok) throw new Error(await res.text());
  if (showAlert) toast("保存しました");
  return true;
}

async function saveDayAndComment() {
  const btn = document.getElementById("saveButton");
  const bubble = document.getElementById("aiComment");

  btn.disabled = true;
  btn.textContent = "保存してコメント作成中…";
  bubble.textContent = "今日の記録を見てる……";

  try {
    await saveDay(false);

    const res = await fetch("/api/ai-comment", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date:document.getElementById("datePicker").value})
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "AI error");

    bubble.textContent = data.comment;
    toast("保存しました");
    await updateWeightDiff(
      document.getElementById("datePicker").value,
      document.getElementById("weight").value || null
    );
  } catch(e) {
    console.error(e);
    bubble.textContent = "記録は確認した。AIコメントを作れなかった場合は、少ししてからもう一度保存してみてくれ。";
    alert("保存またはAIコメント生成でエラーが発生しました。Renderのログを確認してください。");
  } finally {
    btn.disabled = false;
    btn.textContent = "記録を保存";
  }
}

async function generateAIComment() {
  // 履歴等から再生成したくなった時のために関数自体は残す
  const bubble = document.getElementById("aiComment");
  bubble.textContent = "今日の記録を見てる……";
  const res = await fetch("/api/ai-comment", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date:document.getElementById("datePicker").value})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "AI error");
  bubble.textContent = data.comment;
}

async function loadHistory() {
  const res = await fetch("/api/history");
  if (!res.ok) return;
  const rows = await res.json();
  const wrap = document.getElementById("historyList");
  wrap.innerHTML = rows.length ? rows.map(x => `
    <button class="history-row" onclick="openDate('${x.log_date}')">
      <div>
        <strong>${x.log_date}</strong>
        <div class="subtle">${x.ai_comment ? escapeHtml(x.ai_comment).slice(0,70) : "AIコメントなし"}</div>
      </div>
      <span class="history-weight">${x.weight != null ? x.weight + "kg" : "—"}</span>
    </button>`).join("") : `<p class="subtle">まだ記録がありません。</p>`;
}

async function loadGraph() {
  const res = await fetch("/api/weights");
  if (!res.ok) return;
  const rows = await res.json();
  const ctx = document.getElementById("weightChart");
  if (weightChart) weightChart.destroy();
  weightChart = new Chart(ctx, {
    type:"line",
    data:{
      labels:rows.map(x => x.log_date),
      datasets:[{label:"体重 (kg)", data:rows.map(x => x.weight), tension:.3}]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:false}}
    }
  });
}

function openDate(d) {
  // iPhone Safari/PWA対策:
  // 過去日のフォームをその場で差し替えず、ページを再読み込みする。
  window.location.href = "/?date=" + encodeURIComponent(d);
}

function switchTab(tabId) {
  document.querySelectorAll(".tab-panel").forEach(x => x.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(x => x.classList.toggle("active", x.dataset.tab === tabId));
  if (tabId === "historyTab") loadHistory();
  if (tabId === "graphTab") loadGraph();
  if (tabId === "tweetTab") { loadTweet(); loadTweetHistory(); }
}

document.querySelectorAll(".nav-btn").forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
document.getElementById("datePicker").addEventListener("change", function() {
  const selectedDate = this.value;
  if (!selectedDate) return;
  window.location.href = "/?date=" + encodeURIComponent(selectedDate);
});
document.getElementById("sorenessInput").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); addSoreness(); }
});

function toast(text) {
  const x = document.createElement("div");
  x.className = "toast";
  x.textContent = text;
  document.body.appendChild(x);
  setTimeout(() => x.remove(), 1700);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

async function loadTweet() {
  const d = document.getElementById("datePicker").value;
  const res = await fetch(`/api/tweet/${d}`);
  if (!res.ok) return;
  const data = await res.json();
  if (data && data.tweet_text != null) {
    document.getElementById("tweetText").value = data.tweet_text;
    updateTweetCount();
  } else {
    await generateTweet(false);
  }
}

async function generateTweet(showToast=true) {
  const d = document.getElementById("datePicker").value;
  const res = await fetch("/api/tweet/generate", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date:d})
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || "ツイート文を作れませんでした。");
    return;
  }
  document.getElementById("tweetText").value = data.tweet_text || "";
  updateTweetCount();
  if (showToast) toast("ツイート文を作りました");
  await loadTweetHistory();
}

async function saveTweet() {
  const d = document.getElementById("datePicker").value;
  const text = document.getElementById("tweetText").value;
  const res = await fetch("/api/tweet/save", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date:d, tweet_text:text})
  });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || "保存できませんでした。");
    return;
  }
  updateTweetCount();
  toast("ツイート文を保存しました");
  await loadTweetHistory();
}

async function copyTweet() {
  const text = document.getElementById("tweetText").value;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const t = document.getElementById("tweetText");
    t.focus();
    t.select();
    document.execCommand("copy");
  }
  toast("コピーしました");
}

function updateTweetCount() {
  const t = document.getElementById("tweetText");
  if (!t) return;
  const n = [...t.value].length;
  document.getElementById("tweetCount").textContent = `${n} / 140`;
}

async function loadTweetHistory() {
  const res = await fetch("/api/tweets");
  if (!res.ok) return;
  const rows = await res.json();
  const wrap = document.getElementById("tweetHistory");
  wrap.innerHTML = rows.length ? rows.map(x => `
    <button type="button" class="tweet-history-row" onclick="openTweetDate('${x.log_date}')">
      <strong>${x.log_date}</strong>
      <span>${escapeHtml(x.tweet_text || "").replace(/\n/g,"<br>")}</span>
    </button>
  `).join("") : `<p class="subtle">まだ保存されたツイートはありません。</p>`;
}

function openTweetDate(d) {
  document.getElementById("datePicker").value = d;
  fetch(`/api/tweet/${d}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById("tweetText").value = data?.tweet_text || "";
      updateTweetCount();
    });
}

const tweetTextEl = document.getElementById("tweetText");
if (tweetTextEl) tweetTextEl.addEventListener("input", updateTweetCount);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");
loadDay();
</script>

</html>
